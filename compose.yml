services:
  # Infrastructure as code
  opentofu:
    image: smith-lab-opentofu:latest
    build:
      context: ./infrastructure/opentofu/install
    stdin_open: true
    tty: true
    env_file:
      - .env
    volumes:
      - .:/tofu:z
    working_dir: /tofu/infrastructure/opentofu
    command: /bin/bash
  
  # Configuration engine
  ansible:
    image: smith-lab-ansible:latest
    build:
      context: ./infrastructure/ansible
    stdin_open: true
    depends_on:
      - opentofu
    tty: true
    env_file:
      - .env
    environment:
      ANSIBLE_CONFIG: /ansible/infrastructure/ansible/ansible.cfg
    volumes:
      - .:/ansible:z
      - ${HOME}/.ssh:/root/.ssh:ro,Z
    working_dir: /ansible/infrastructure/ansible
    command: /bin/bash
    