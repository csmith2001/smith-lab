---
- name: Discover host services
  set_fact:
    host_services: >-
      {{
        services
        | dict2items
        | selectattr('value.targets', 'contains', inventory_hostname)
        | list
      }}

- name: Discover container services
  set_fact:
    container_services: >-
      {{
        host_services
        | selectattr('value.deployment', 'equalto', 'container')
        | list
      }}

- name: Create infra root
  file:
    path: "{{ infra_root }}"
    state: directory
    owner: svc_infra
    group: infra_staff
    mode: "2755"
  become: true

- name: Create infra directories
  file:
    path: "{{ infra_root }}/{{ volume }}"
    state: directory
    owner: svc_infra
    group: infra_staff
    mode: "2755"
  loop: "{{ volumes }}"
  loop_control:
    loop_var: volume

- name: Create service storage
  file:
    path: "{{ infra_root }}/containers/{{ item.key }}"
    state: directory
    owner: svc_infra
    group: infra_staff
    mode: "2755"
  loop: "{{ container_services }}"

- name: Clone repositories
  git:
    repo: "{{ item.value.url }}"
    dest: "{{ infra_root }}/repos/{{ item.key }}"
    version: "{{ item.value.branch }}"
    update: true
  loop: "{{ repositories | dict2items }}"
