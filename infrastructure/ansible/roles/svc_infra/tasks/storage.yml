---
- name: Discover host services
  set_fact:
    host_services: >-
      {{
        services
        | dict2items
        | selectattr('value.targets', 'contains', inventory_hostname)
        | list
      }}

- name: Discover container services
  set_fact:
    container_services: >-
      {{
        host_services
        | selectattr('value.deployment', 'equalto', 'container')
        | list
      }}

- name: Create infra root
  include_tasks: create-directory.yml
  vars:
    directory_path: "{{ infra_root }}"

- name: Create infra directories
  include_tasks: create-directory.yml
  vars:
    directory_path: "{{ infra_root }}/{{ volume }}"
  loop: "{{ volumes }}"
  loop_control:
    loop_var: volume

- name: Create service storage
  include_tasks: create-directory.yml
  vars:
    directory_path: "{{ infra_root }}/containers/{{ item.key }}"
  loop: "{{ container_services }}"

- name: Clone repositories
  git:
    repo: "{{ item.value.url }}"
    dest: "{{ infra_root }}/repos/{{ item.key }}"
    version: "{{ item.value.branch }}"
    update: true
  loop: "{{ repositories | dict2items }}"
  when: inventory_hostname != networks.lan.domain.dns_host