---
- name: Playbook Start
  debug:
    msg:
      - "Host: {{ inventory_hostname }}"
      - "OS: {{ ansible_facts['os_family'] }}"
      - "Infra root: {{ infra_root }}"
      - "Disks: {{ disks }}"

- name: Install Base Packages
  import_tasks: packages.yml

- name: Create Folders
  import_tasks: storage.yml

- name: Deploy services
  include_tasks: "services/{{ item.key }}.yml"
  loop: "{{ host_services }}"

- name: Join Domain
  import_tasks: domain-join.yml
