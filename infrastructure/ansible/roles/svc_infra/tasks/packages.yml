- name: Install bootstrap packages
  package:
    name:
      - git
      - podman
      - podman-compose
      - curl
      - rsync
      - jq
      - unzip
    state: present

- name: Enable podman socket
  systemd:
    name: podman.socket
    enabled: true
    state: started

- name: Create infra network
  command:
    cmd: podman network create infra_net
  register: podman_network
  changed_when: podman_network.rc == 0
  failed_when:
    - podman_network.rc != 0
    - "'already exists' not in podman_network.stderr"
