---
- name: Create caddy directories
  file:
    path: "{{ infra_root }}/containers/caddy/{{ directory }}"
    state: directory
    owner: svc_infra
    group: infra_staff
    mode: "2755"
  loop:
    - data
    - config
  loop_control:
    loop_var: directory
  
- name: Render compose file
  template:
    src: caddy-compose.yml.j2
    dest: "{{ infra_root }}/containers/caddy/compose.yml"

- name: Render Caddyfile
  template:
    src: Caddyfile.j2
    dest: "{{ infra_root }}/containers/caddy/config/Caddyfile"

- name: Render nftables
  become: true
  template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf

- name: Validate nftables configuration
  become: true
  command:
    argv:
      - nft
      - -c
      - -f
      - /etc/nftables.conf
  changed_when: false

- name: Start Caddy
  command: podman-compose up -d
  args:
    chdir: "{{ infra_root }}/containers/caddy"