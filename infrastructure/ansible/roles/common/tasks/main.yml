---
- name: Playbook Start
  debug:
    msg:
      - "Host: {{ inventory_hostname }}"
      - "OS: {{ ansible_facts['os_family'] }}"
      - "Disk(s): {{ volumes }}"

- name: Discover host services
  set_fact:
    host_services: >-
      {{
        services
        | dict2items
        | selectattr('value.targets', 'contains', inventory_hostname)
        | list
      }}

- name: Determine container services
  set_fact:
    container_services: >-
      {{
        host_services
        | selectattr('value.deployment', 'equalto', 'container')
        | list
      }}

- name: Display host services
  debug:
    msg: "{{ host_services }}"

- name: Create Folders
  import_tasks: storage.yml

- name: Clone repositories
  git:
    repo: "{{ item.value.url }}"
    dest: "/srv/infra/repos/{{ item.key }}"
    version: "{{ item.value.branch }}"
    update: true
  loop: "{{ repositories | dict2items }}"

- name: Deploy services
  include_tasks: "services/{{ item.key }}.yml"
  loop: "{{ host_services }}"

- name: Join Domain
  import_tasks: domain-join.yml
