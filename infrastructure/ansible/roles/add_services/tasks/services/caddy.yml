---
- name: Create caddy directories
  file:
    path: "{{ infra_root }}/containers/caddy/{{ directory }}"
    state: directory
    owner: svc_infra
    group: infra_staff
    mode: "2755"
  loop:
    - data
    - config
  loop_control:
    loop_var: directory
  
- name: Render compose file
  template:
    src: caddy/caddy-compose.yml.j2
    dest: "{{ infra_root }}/containers/caddy/compose.yml"

- name: Render Caddyfile
  template:
    src: caddy/Caddyfile.j2
    dest: "{{ infra_root }}/containers/caddy/config/Caddyfile"

- name: Start Caddy
  command: podman-compose up -d
  args:
    chdir: "{{ infra_root }}/containers/caddy"