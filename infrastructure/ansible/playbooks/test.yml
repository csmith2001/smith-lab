---
- hosts: localhost
  tasks:
    # Include hosts.yml
    - name: include_hosts
      include_vars:
        file: ../inventory/outputs/hosts.yml
    # Display hosts
    - name: show_hosts
      debug:
        msg: "{{ item.key }} => {{ item.value.host_type }}"
      loop: "{{ managed_hosts | dict2items }}"
    # Filter host_type
    - name: filter_hosts
      set_fact:
        servers: >-
          {{
            managed_hosts
            | dict2items
            | selectattr('value.host_type', 'equalto', 'server')
            | map(attribute='key')
            | list
          }}
        workstations: >-
          {{
            managed_hosts
            | dict2items
            | selectattr('value.host_type', 'equalto', 'workstation')
            | map(attribute='key')
            | list
          }}
    - name: show_servers
      debug:
        msg: "{{ item }}"
      loop: "{{ servers }}"

    - name: show_workstations
      debug:
        msg: "{{ item }}"
      loop: "{{ workstations }}"