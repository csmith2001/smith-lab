---
- name: Bootstrap Infrastructure
  hosts: "{{ target_host }}"
  gather_facts: true

  roles:
    - role: bootstrap
    - role: domain_add
      when: domain_add | default(false) | bool
    - role: domain_join
      when: domain_join | default(false) | bool
    - role: add_services
      when: add_services | default(false) | bool
